<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projet - Visunyx Designer</title>
  <link rel="icon" href="https://cdn.prod.website-files.com/6877a7a543a6800105f4b19d/6877a8a8bd06034b54695630_webclip.avif">
  <link rel="dns-prefetch" href="https://nokrexfszurxxuspvbjd.supabase.co">
  <link rel="preconnect" href="https://nokrexfszurxxuspvbjd.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style-base.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/lucide@0.309.0/dist/umd/lucide.min.js" defer></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/supabase.js"></script>
  <script src="../shared/components.js"></script>
  <script src="../shared/chat.js"></script>
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .brief-section { margin-bottom: 20px; }
    .brief-key { font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--purple); margin-bottom: 6px; }
    .brief-val { font-size: var(--text-sm); color: var(--fg); line-height: 1.75; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 12px 14px; }
    .upload-zone { border: 2px dashed var(--glass-border); border-radius: var(--radius); padding: 40px 24px; text-align: center; cursor: pointer; transition: all 0.25s var(--ease); margin-bottom: 20px; }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--purple); background: var(--purple-subtle); }
    .upload-zone input[type=file] { display: none; }
  </style>
</head>
<body>
<div class="vx-bg"><div class="vx-orb vx-orb-1"></div><div class="vx-orb vx-orb-2"></div><div class="vx-orb vx-orb-3"></div></div>
<div class="vx-grid"></div>
<svg class="vx-noise" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg>

<div class="app-layout">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <div id="topbar-container"></div>
    <div class="page-content">

      <!-- Tabs -->
      <div class="tabs" style="margin-bottom:24px;">
        <button class="tab-btn active" onclick="switchTab('brief')" data-i18n="tab.brief">Brief</button>
        <button class="tab-btn" onclick="switchTab('fichiers')" data-i18n="tab.files">Fichiers</button>
        <button class="tab-btn" onclick="switchTab('interne')" data-i18n="tab.internal">Discussion interne</button>
      </div>

      <!-- Header -->
      <div style="margin-bottom:24px;" id="project-header">
        <div class="skeleton" style="height:28px;width:60%;margin-bottom:10px;"></div>
        <div class="skeleton" style="height:14px;width:35%;"></div>
      </div>

      <!-- Quick stats -->
      <div id="quick-stats" style="display:none;margin-bottom:20px;">
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <div class="glass-card" style="padding:14px 18px;flex:1;min-width:120px;">
            <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-subtle);margin-bottom:4px;" data-i18n="files.title">Fichiers</div>
            <div style="font-size:var(--text-xl);font-weight:700;color:var(--fg);" id="stat-files-total">0</div>
          </div>
          <div class="glass-card" style="padding:14px 18px;flex:1;min-width:120px;">
            <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-subtle);margin-bottom:4px;" data-i18n="tab.internal">Discussion</div>
            <div style="font-size:var(--text-xl);font-weight:700;color:var(--fg);" id="stat-messages-total">0</div>
          </div>
          <div class="glass-card" style="padding:14px 18px;flex:1;min-width:120px;">
            <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-subtle);margin-bottom:4px;" data-i18n="th.deadline">Echeance</div>
            <div style="font-size:var(--text-sm);font-weight:700;color:var(--fg);" id="stat-due-date">-</div>
          </div>
        </div>
      </div>

      <!-- TAB: Brief -->
      <div id="tab-brief" class="tab-content active">
        <div class="glass-card" style="padding:28px;" id="brief-container">
          <div class="skeleton" style="height:14px;width:90%;margin-bottom:10px;"></div>
          <div class="skeleton" style="height:14px;width:70%;margin-bottom:10px;"></div>
          <div class="skeleton" style="height:14px;width:80%;"></div>
        </div>
      </div>

      <!-- TAB: Fichiers -->
      <div id="tab-fichiers" class="tab-content">
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()"
             ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
          <input type="file" id="file-input" multiple onchange="handleFiles(this.files)">
          <i data-lucide="upload-cloud" style="width:36px;height:36px;color:var(--purple);margin-bottom:12px;"></i>
          <div style="font-size:var(--text-base);font-weight:600;color:var(--fg);margin-bottom:4px;" data-i18n="files.upload">Deposer des livrables ici</div>
          <div style="font-size:var(--text-xs);color:var(--fg-muted);">PNG, JPG, SVG, PDF, ZIP, AI, PSD...</div>
        </div>
        <!-- Folder actions -->
        <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" onclick="promptNewFolder()">
            <i data-lucide="folder-plus" style="width:14px;height:14px;margin-right:5px;"></i> <span data-i18n="files.newfolder">Nouveau dossier</span>
          </button>
          <div id="current-folder-path" style="font-size:var(--text-xs);color:var(--fg-muted);display:none;align-items:center;gap:6px;">
            <a href="#" onclick="openFolder(null);return false;" style="color:var(--purple);text-decoration:none;font-weight:600;" data-i18n="files.allfiles">Tous les fichiers</a>
            <span id="folder-breadcrumb"></span>
          </div>
        </div>
        <div id="files-container">
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>
      </div>

      <!-- TAB: Interne (discussion admin + designer) -->
      <div id="tab-interne" class="tab-content">
        <div style="padding:10px 14px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);border-radius:10px;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span style="font-size:var(--text-xs);color:#FBBF24;font-weight:600;" data-i18n="chat.internal.label">Espace interne - visible uniquement par l'equipe</span>
        </div>
        <div class="glass-card" style="overflow:hidden;">
          <div class="chat-wrap">
            <div class="chat-messages" id="int-messages">
              <div style="text-align:center;padding:40px;color:var(--fg-subtle);font-size:var(--text-sm);" data-i18n="loading">Chargement...</div>
            </div>
            <div class="chat-input-bar">
              <textarea id="int-input" data-i18n="chat.placeholder.internal" placeholder="Message interne (equipe)..." rows="1"></textarea>
              <button class="btn btn-icon" onclick="window._internalChat.sendMessage()" style="background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.3);color:#FBBF24;">
                <i data-lucide="send" style="width:16px;height:16px;"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script>
let projectId = null;
let projectData = null;
let currentUser = null;
let typingPresence = null;

async function init() {
  const auth = await requireAuth(['designer']);
  if (!auth) return;
  currentUser = auth.user;

  projectId = getParam('id');
  if (!projectId) { window.location.href = 'index.html'; return; }

  document.getElementById('sidebar-container').innerHTML = renderSidebar('projects', 0, 'designer');
  document.getElementById('topbar-container').innerHTML = renderTopbar(
    t('designer.project.page'), '',
    `<a href="javascript:history.back()" class="btn btn-ghost btn-sm">
       <i data-lucide="arrow-left" style="width:13px;height:13px;"></i> <span data-i18n="btn.back">Retour</span>
     </a>`
  );
  await setupSidebarUser();
  refreshIcons();

  await Promise.all([loadProject(), loadFiles()]);

  // Internal chat (admin + designer)
  window._internalChat = new ChatChannel({
    projectId,
    currentUserId: currentUser.id,
    currentUserName: auth.profile.full_name || auth.user.email,
    currentUserRole: 'designer',
    isInternal: true,
    messagesContainer: document.getElementById('int-messages'),
    inputElement: document.getElementById('int-input'),
    pollIntervalMs: 10000
  });
  await window._internalChat.loadMessages();

  initSpotlight();
  refreshIcons();
  translatePage();
}

function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`tab-${name}`)?.classList.add('active');
  document.querySelectorAll('.tabs .tab-btn').forEach(btn => {
    if (btn.getAttribute('onclick')?.includes(`'${name}'`)) btn.classList.add('active');
  });
}

// ── Project ───────────────────────────────────────────────
async function loadProject() {
  try {
    const { data: p, error } = await db.from('projects')
      .select('*')
      .eq('id', projectId).single();
    if (error || !p) { window.location.href = 'index.html'; return; }
    projectData = p;
    document.title = `${p.title} - Visunyx Designer`;

    const isLate = p.due_date && new Date(p.due_date) < new Date() && !['termine','concept-livre'].includes(p.status);
    document.getElementById('project-header').innerHTML = `
      <div style="font-size:clamp(20px,3vw,28px);font-weight:700;color:var(--fg);margin-bottom:8px;">${escHtml(p.title)}</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        ${renderStatusBadge(p.status)}
        ${renderPriorityBadge(p.priority)}
        ${p.project_type ? `<span style="font-size:var(--text-xs);color:var(--fg-subtle);">${escHtml(p.project_type)}</span>` : ''}
      </div>`;

    // Quick stats
    document.getElementById('quick-stats').style.display = '';
    document.getElementById('stat-due-date').innerHTML = p.due_date
      ? `<span style="${isLate ? 'color:#F87171;' : ''}">${formatDate(p.due_date)}</span>`
      : '-';

    await loadBrief();
    refreshIcons();
  } catch(e) { showToast(t('toast.error.load'), 'error'); }
}

async function loadBrief() {
  const brief = await API.getBrief(projectId);
  const container = document.getElementById('brief-container');
  // Use designer-specific brief (anonymized) if available, fallback to ai_brief
  const designerBrief = brief.ai_brief_designer || brief.ai_brief;
  if (!designerBrief && !brief.summary) {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';

  let html = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
    <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,rgba(232,89,12,0.2),rgba(232,89,12,0.15));border:1px solid rgba(232,89,12,0.3);display:flex;align-items:center;justify-content:center;">
      <i data-lucide="file-text" style="width:16px;height:16px;color:var(--purple);"></i>
    </div>
    <div>
      <div style="font-size:var(--text-base);font-weight:700;color:var(--fg);">${t('designer.project.brief')}</div>
    </div>
  </div>`;

  if (designerBrief) {
    html += `<div style="white-space:pre-wrap;line-height:1.8;color:var(--fg);font-size:14px;">${escHtml(designerBrief)}</div>`;
  }

  container.innerHTML = html;
  refreshIcons();
}

// ── Files & Folders ──────────────────────────────────────
let allFiles = [];
let currentFolder = null;

async function loadFiles() {
  try {
    allFiles = await API.getDeliverables(projectId);
    const statEl = document.getElementById('stat-files-total');
    if (statEl) statEl.textContent = allFiles ? allFiles.length : 0;
    renderFilesView();
    refreshIcons();
  } catch(e) { console.error(e); }
}

function getFolders() {
  const folders = new Set();
  allFiles.forEach(f => { if (f.category) folders.add(f.category); });
  return Array.from(folders).sort();
}

function renderFilesView() {
  const container = document.getElementById('files-container');
  const pathEl = document.getElementById('current-folder-path');
  const breadcrumb = document.getElementById('folder-breadcrumb');

  if (currentFolder) {
    pathEl.style.display = 'flex';
    breadcrumb.innerHTML = `<span style="color:var(--fg-subtle);">›</span> <span style="font-weight:600;color:var(--fg);">${escHtml(currentFolder)}</span>`;
    const files = allFiles.filter(f => f.category === currentFolder && f.file_name !== '.folder');
    if (!files.length) {
      container.innerHTML = renderEmptyState('folder-open', t('files.folder.empty'), t('files.folder.hint'));
    } else {
      container.innerHTML = '<div class="files-grid">' + files.map(f => {
        return renderFileCard(f,
          `downloadFile('${f.file_path}','${escHtml(f.file_name)}')`,
          `deleteFile('${f.id}','${escHtml(f.file_path)}','${escHtml(f.file_name)}')`,
          `renameFile('${f.id}','${escHtml(f.file_name)}')`
        );
      }).join('') + '</div>';
    }
  } else {
    pathEl.style.display = 'none';
    const folders = getFolders();
    const uncategorized = allFiles.filter(f => !f.category && f.file_name !== '.folder');
    if (!folders.length && !uncategorized.length) {
      container.innerHTML = renderEmptyState('upload-cloud', t('files.empty'), t('files.empty.hint'));
    } else {
      let html = '';
      if (folders.length) {
        html += '<div class="files-grid">';
        html += folders.map(folder => {
          const count = allFiles.filter(f => f.category === folder && f.file_name !== '.folder').length;
          return `
          <div class="glass-card file-card" style="cursor:pointer;position:relative;" onclick="openFolder('${escHtml(folder)}')">
            <div class="file-icon" style="background:rgba(232,89,12,0.12);"><i data-lucide="folder" style="width:28px;height:28px;color:var(--purple);"></i></div>
            <div class="file-name">${escHtml(folder)}</div>
            <div class="file-meta">${count} ${count > 1 ? t('files') : t('file')}</div>
            <div style="position:absolute;top:8px;right:8px;display:flex;gap:4px;">
              <button class="btn btn-ghost btn-sm btn-icon" onclick="event.stopPropagation();renameFolder('${escHtml(folder)}')" title="Renommer" style="width:24px;height:24px;padding:0;">
                <i data-lucide="pencil" style="width:11px;height:11px;"></i>
              </button>
              <button class="btn btn-danger btn-sm btn-icon" onclick="event.stopPropagation();deleteFolder('${escHtml(folder)}')" title="Supprimer" style="width:24px;height:24px;padding:0;">
                <i data-lucide="trash-2" style="width:11px;height:11px;"></i>
              </button>
            </div>
          </div>`;
        }).join('');
        html += '</div>';
      }
      if (uncategorized.length) {
        if (folders.length) html += `<div style="margin-top:20px;font-size:var(--text-xs);font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;">${t('files.nofiles')}</div>`;
        html += '<div class="files-grid">' + uncategorized.map(f => {
          return renderFileCard(f,
            `downloadFile('${f.file_path}','${escHtml(f.file_name)}')`,
            `deleteFile('${f.id}','${escHtml(f.file_path)}','${escHtml(f.file_name)}')`
          );
        }).join('') + '</div>';
      }
      container.innerHTML = html;
    }
  }
  refreshIcons();
  if (typeof loadFileThumbnails === 'function') loadFileThumbnails();
}

function openFolder(folder) { currentFolder = folder; renderFilesView(); }

async function promptNewFolder() {
  const name = await promptInput(t('files.newfolder.title'), t('files.newfolder.placeholder'), '', 'folder-plus', t('files.newfolder.create'));
  if (!name) return;
  if (getFolders().includes(name)) { showToast(t('files.folder.exists'), 'error'); return; }
  try {
    await API.createDeliverable({
      project_id: projectId, file_name: '.folder', file_path: '',
      file_size: 0, file_type: 'folder', category: name, uploaded_by: currentUser.id,
      is_hidden: true
    });
    await loadFiles();
    showToast(t('files.folder.created'), 'success');
  } catch(e) { showToast(t('designer.project.folder.create.error'), 'error'); }
}

async function renameFolder(oldName) {
  const newName = await promptInput(t('files.rename.title'), t('files.rename.placeholder'), oldName, 'pencil', t('files.rename.confirm'));
  if (!newName || newName === oldName) return;
  if (getFolders().includes(newName)) { showToast(t('files.folder.exists'), 'error'); return; }
  try {
    const filesInFolder = allFiles.filter(f => f.category === oldName);
    for (const f of filesInFolder) {
      await db.from('deliverables').update({ category: newName }).eq('id', f.id);
    }
    if (currentFolder === oldName) currentFolder = newName;
    await loadFiles();
    showToast(t('files.folder.renamed'), 'success');
  } catch(e) { showToast(t('designer.project.rename.error'), 'error'); }
}

async function renameFile(fileId, oldName) {
  const newName = await promptInput(t('files.rename.file'), t('files.rename.placeholder'), oldName, 'file-edit', t('files.rename.confirm'));
  if (!newName || newName === oldName) return;
  try {
    await db.from('deliverables').update({ file_name: newName }).eq('id', fileId);
    await loadFiles();
    showToast(t('designer.project.file.renamed'), 'success');
  } catch(e) { showToast(t('designer.project.rename.error'), 'error'); }
}

function deleteFolder(folderName) {
  const filesInFolder = allFiles.filter(f => f.category === folderName);
  const msg = filesInFolder.length
    ? `"${folderName}" - ${filesInFolder.length} ${filesInFolder.length > 1 ? t('files') : t('file')}. ${t('designer.project.folder.delete.all')}`
    : `"${folderName}" ${t('designer.project.folder.delete.empty')}`;
  confirmAction(t('confirm.delete.folder'), msg, async () => {
    try {
      for (const f of filesInFolder) await API.deleteDeliverable(f.id, f.file_path);
      if (currentFolder === folderName) currentFolder = null;
      allFiles = allFiles.filter(f => f.category !== folderName);
      renderFilesView();
      showToast(t('files.folder.deleted'), 'success');
    } catch(e) { showToast(t('designer.project.folder.delete.error'), 'error'); }
  });
}

function deleteFile(id, path, name) {
  confirmAction(t('confirm.delete.file'), `"${name}" ${t('files.delete.msg')}`, async () => {
    try {
      await API.deleteDeliverable(id, path);
      showToast(t('files.deleted'), 'success');
      await loadFiles();
    } catch(e) { showToast(t('designer.project.delete.error'), 'error'); }
  });
}

function handleDragOver(e) { e.preventDefault(); document.getElementById('upload-zone').classList.add('drag-over'); }
function handleDragLeave() { document.getElementById('upload-zone').classList.remove('drag-over'); }
function handleDrop(e) { e.preventDefault(); handleDragLeave(); handleFiles(e.dataTransfer.files); }

async function handleFiles(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;
  const folder = currentFolder || null;
  for (const file of files) {
    try {
      const path = `${projectId}/${Date.now()}-${sanitizeFileName(file.name)}`;
      await uploadFile('deliverables', path, file);
      await API.createDeliverable({
        project_id: projectId, file_name: file.name, file_path: path,
        file_size: file.size, file_type: file.type,
        category: folder, uploaded_by: currentUser.id,
        is_hidden: true
      });
      await API.logActivity({
        project_id: projectId, user_id: currentUser.id,
        action: 'file_uploaded', details: { file_name: file.name, folder: folder }
      });
      showToast(`${file.name} ${t('files.uploaded')}`, 'success');
    } catch(e) { showToast(`${t('files.upload.error')} ${file.name}`, 'error'); }
  }
  await loadFiles();
}

async function downloadFile(path, name) {
  const url = await getFileUrl('deliverables', path);
  if (!url) { showToast(t('files.download.error'), 'error'); return; }
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
}

function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }


document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
