<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon projet - Visunyx Studio</title>
  <link rel="icon" href="https://cdn.prod.website-files.com/6877a7a543a6800105f4b19d/6877a8a8bd06034b54695630_webclip.avif">
  <link rel="dns-prefetch" href="https://nokrexfszurxxuspvbjd.supabase.co">
  <link rel="preconnect" href="https://nokrexfszurxxuspvbjd.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style-base.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/lucide@0.309.0/dist/umd/lucide.min.js" defer></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/supabase.js"></script>
  <script src="../shared/components.js"></script>
  <script src="../shared/chat.js"></script>

  <style>
    .client-layout { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; }
    .client-topbar { height: 64px; background: rgba(14,14,16,0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 90; }
    .client-content { flex: 1; padding: 36px 32px; max-width: 1000px; width: 100%; margin: 0 auto; }

    .brief-block { margin-bottom: 8px; }
    .brief-key { font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--purple); margin-bottom: 6px; }
    .brief-val { font-size: var(--text-sm); color: var(--fg); line-height: 1.75; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 12px 14px; }

    /* Loading skeleton animation */
    .vx-skeleton-block {
      background: linear-gradient(90deg, rgba(232,89,12,0.06) 25%, rgba(232,89,12,0.12) 50%, rgba(232,89,12,0.06) 75%);
      background-size: 200% 100%;
      animation: vx-shimmer 1.5s infinite;
      border-radius: var(--radius);
      min-height: 80px;
    }
    @keyframes vx-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* GPU hints for animated elements */
    .stepper { will-change: transform; }
    .glass-card { will-change: transform; }

    @media (max-width: 600px) {
      .client-topbar { padding: 0 18px; }
      .client-content { padding: 20px 16px; }
    }
  </style>
</head>
<body>
<div class="vx-bg"><div class="vx-orb vx-orb-1"></div><div class="vx-orb vx-orb-2"></div><div class="vx-orb vx-orb-3"></div></div>
<div class="vx-grid"></div>
<svg class="vx-noise" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg>

<div class="client-layout">
  <header class="client-topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="javascript:history.back()" class="btn btn-ghost btn-sm" style="padding:7px 12px;">
        <i data-lucide="arrow-left" style="width:13px;height:13px;"></i> <span data-i18n="btn.back">Retour</span>
      </a>
      <img src="../shared/visunyx-icon.svg" alt="Visunyx" style="height:20px;width:auto;">
      <span style="font-size:14px;font-weight:700;color:#fff;">Visunyx</span>
    </div>
    <div class="avatar" id="topbar-avatar" style="cursor:pointer;overflow:hidden;" onclick="openAccountPanel()" data-i18n-title="account.title"></div>
  </header>

  <main class="client-content">

    <!-- Header -->
    <div style="margin-bottom:28px;" id="project-header">
      <div class="skeleton" style="height:32px;width:55%;margin-bottom:10px;"></div>
      <div class="skeleton" style="height:14px;width:35%;"></div>
    </div>

    <!-- Stepper -->
    <div class="glass-card" style="margin-bottom:24px;overflow:hidden;">
      <div class="stepper" id="stepper"></div>
    </div>

    <!-- Revision button -->
    <div id="revision-banner" style="display:none;margin-bottom:20px;">
      <a id="revision-link" href="#" style="display:flex;align-items:center;gap:14px;padding:18px 24px;background:linear-gradient(135deg,rgba(232,89,12,0.08),rgba(232,89,12,0.06));border:1px solid rgba(232,89,12,0.25);border-radius:14px;text-decoration:none;color:inherit;transition:all 0.25s;" onmouseover="this.style.borderColor='rgba(232,89,12,0.5)'" onmouseout="this.style.borderColor='rgba(232,89,12,0.25)'">
        <div style="width:40px;height:40px;border-radius:10px;background:rgba(232,89,12,0.15);border:1px solid rgba(232,89,12,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i data-lucide="refresh-cw" style="width:18px;height:18px;color:var(--purple);"></i>
        </div>
        <div style="flex:1;">
          <div style="font-size:var(--text-sm);font-weight:700;color:var(--fg);" data-i18n="client.revision.btn">Demander une revision</div>
          <div style="font-size:var(--text-xs);color:var(--fg-muted);margin-top:2px;" data-i18n="client.revision.hint">Donnez vos retours sur les concepts pour ajuster le design</div>
        </div>
        <i data-lucide="arrow-right" style="width:16px;height:16px;color:var(--purple);flex-shrink:0;"></i>
      </a>
    </div>

    <!-- Tabs -->
    <div class="tabs" style="margin-bottom:22px;">
      <button class="tab-btn" onclick="switchTab('brief')" data-i18n="tab.brief">Brief</button>
      <button class="tab-btn active" onclick="switchTab('fichiers')" data-i18n="tab.files">Fichiers</button>
      <button class="tab-btn" onclick="switchTab('messages')" data-i18n="tab.messages">
        Messages
        <span id="msg-badge" style="display:none;background:var(--purple);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;margin-left:4px;"></span>
      </button>
    </div>

    <!-- TAB: Brief -->
    <div id="tab-brief" class="tab-pane" style="display:none;">
      <div class="glass-card" style="padding:28px;" id="brief-container">
        <div class="skeleton" style="height:14px;width:90%;margin-bottom:10px;"></div>
        <div class="skeleton" style="height:14px;width:70%;margin-bottom:10px;"></div>
        <div class="skeleton" style="height:14px;width:80%;"></div>
      </div>
    </div>

    <!-- TAB: Fichiers -->
    <div id="tab-fichiers" class="tab-pane" style="display:block;">
      <div style="border:2px dashed rgba(232,89,12,0.2);border-radius:var(--radius);padding:32px 24px;text-align:center;cursor:pointer;transition:all 0.25s;margin-bottom:20px;" id="upload-zone"
           onclick="document.getElementById('file-input').click()"
           ondragover="event.preventDefault();this.style.borderColor='var(--purple)';this.style.background='rgba(232,89,12,0.05)'"
           ondragleave="this.style.borderColor='';this.style.background=''"
           ondrop="event.preventDefault();this.style.borderColor='';this.style.background='';handleFiles(event.dataTransfer.files)">
        <input type="file" id="file-input" multiple onchange="handleFiles(this.files)" style="display:none;">
        <i data-lucide="upload-cloud" style="width:32px;height:32px;color:var(--purple);margin-bottom:10px;"></i>
        <div style="font-size:var(--text-sm);font-weight:600;color:var(--fg);margin-bottom:4px;" data-i18n="client.files.add">Ajouter des fichiers a votre dossier</div>
        <div style="font-size:var(--text-xs);color:var(--fg-muted);" data-i18n="client.upload.hint">Logo existant, references, moodboard, photos...</div>
      </div>
      <!-- Folder navigation -->
      <div id="current-folder-path" style="font-size:var(--text-xs);color:var(--fg-muted);display:none;align-items:center;gap:6px;margin-bottom:14px;">
        <a href="#" onclick="openFolder(null);return false;" style="color:var(--purple);text-decoration:none;font-weight:600;" data-i18n="files.allfiles">Tous les fichiers</a>
        <span id="folder-breadcrumb"></span>
      </div>
      <div id="files-container">
        <div class="skeleton-card"></div><div class="skeleton-card"></div>
      </div>
    </div>

    <!-- TAB: Messages -->
    <div id="tab-messages" class="tab-pane" style="display:none;">
      <div class="glass-card" style="overflow:hidden;">
        <div class="chat-wrap">
          <div class="chat-messages" id="chat-messages">
            <div style="text-align:center;padding:40px;color:var(--fg-subtle);font-size:var(--text-sm);" data-i18n="loading"></div>
          </div>
          <div class="chat-pending-attachment" id="msg-input-pending">
            <i data-lucide="paperclip" style="width:12px;height:12px;color:var(--purple);flex-shrink:0;"></i>
            <span id="msg-input-pending-name" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
            <button class="remove-attach" onclick="removePendingAttachment('msg-input')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="chat-input-bar">
            <button class="btn-attach" onclick="document.getElementById('msg-attach-file').click()" data-i18n-title="chat.attach">
              <i data-lucide="paperclip" style="width:16px;height:16px;"></i>
            </button>
            <input type="file" id="msg-attach-file" style="display:none;" onchange="setPendingAttachment('msg-input', this.files)">
            <textarea id="msg-input" data-i18n="chat.placeholder.client" placeholder="Envoyer un message à l'équipe Visunyx…" rows="1"></textarea>
            <button class="btn btn-primary btn-icon" onclick="window._clientChat.sendMessage()">
              <i data-lucide="send" style="width:16px;height:16px;"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>

<div id="account-panel-container"></div>
<div id="toast-container" class="toast-container"></div>

<script>
let projectId   = null;
let currentUser = null;

const STEPS = [
  { key: 'nouveau',      label: () => t('step.nouveau')  },
  { key: 'brief-envoye', label: () => t('step.brief')    },
  { key: 'en-cours',     label: () => t('step.encours')  },
  { key: 'revision',     label: () => t('step.revision') },
  { key: 'concept-livre', label: () => t('step.concept-livre') },
  { key: 'termine',      label: () => t('step.termine')  }
];

async function init() {
  const auth = await requireAuth(['client']);
  if (!auth) return;
  currentUser = auth.user;

  // Inject account panel
  document.getElementById('account-panel-container').innerHTML = renderAccountPanel();

  const avatarEl = document.getElementById('topbar-avatar');
  if (auth.profile.avatar_url) {
    avatarEl.innerHTML = `<img src="${auth.profile.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
  } else {
    avatarEl.textContent = initials(auth.profile.full_name || auth.user.email);
  }

  projectId = getParam('id');
  if (!projectId) { window.location.href = 'index.html'; return; }

  // Client ↔ Admin chat (init object early, load messages in parallel)
  window._clientChat = new ChatChannel({
    projectId,
    currentUserId: currentUser.id,
    currentUserName: auth.profile.full_name || auth.user.email,
    currentUserRole: 'client',
    isInternal: false,
    messagesContainer: document.getElementById('chat-messages'),
    inputElement: document.getElementById('msg-input'),
    attachInputId: 'msg-input',
    badgeElement: document.getElementById('msg-badge'),
    pollIntervalMs: 10000
  });

  // Parallel: load project data, files, and chat messages together
  await Promise.all([loadProject(), loadFiles(), window._clientChat.loadMessages()]);

  initSpotlight();
  refreshIcons();

  translatePage();
}

function switchTab(name) {
  document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
  document.getElementById(`tab-${name}`).style.display = '';
  document.querySelectorAll('.tabs .tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tabs .tab-btn').forEach(b => {
    if (b.getAttribute('onclick')?.includes(name)) b.classList.add('active');
  });
  if (name === 'messages' && window._clientChat) window._clientChat.markRead();
}

async function loadProject() {
  const { data: p, error } = await db.from('projects')
    .select('*, clients(company_name, user_id)')
    .eq('id', projectId).single();
  if (error || !p) { window.location.href = 'index.html'; return; }

  // Security: ensure this project belongs to current user
  if (p.clients?.user_id !== currentUser.id) { window.location.href = 'index.html'; return; }

  document.title = `${p.title} - Visunyx Studio`;
  document.getElementById('project-header').innerHTML = `
    <div style="font-size:clamp(22px,4vw,32px);font-weight:700;color:var(--fg);margin-bottom:8px;letter-spacing:-0.02em;">${escHtml(p.title)}</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      ${renderStatusBadge(p.status)}
      ${p.due_date ? `<span style="font-size:var(--text-xs);color:var(--fg-muted);"><i data-lucide="calendar" style="width:11px;height:11px;vertical-align:middle;margin-right:3px;"></i>${t('client.delivery')} ${formatDate(p.due_date)}</span>` : ''}
    </div>`;

  renderStepper(p.status);

  // Show revision button only during concept-livre status
  if (p.status === 'concept-livre') {
    const banner = document.getElementById('revision-banner');
    if (p.revisions_remaining <= 0) {
      banner.style.display = '';
      banner.innerHTML = `
        <div style="padding:16px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:12px;text-align:center;">
          <div style="font-weight:700;color:var(--fg);margin-bottom:4px;">Révisions épuisées</div>
          <div style="font-size:13px;color:var(--fg-muted);">Vous avez utilisé vos ${p.revisions_total || 0} révisions incluses dans votre pack. Pour des révisions supplémentaires, contactez l'équipe Visunyx.</div>
        </div>`;
    } else {
      banner.style.display = '';
      document.getElementById('revision-link').href = `revision.html?id=${projectId}`;
      // Add revision counter below the link
      const used = (p.revisions_total || 0) - (p.revisions_remaining || 0);
      const counterHtml = `<div style="text-align:center;font-size:var(--text-xs);color:var(--fg-muted);margin-top:8px;">Révision ${used + 1} sur ${p.revisions_total || 0}</div>`;
      banner.insertAdjacentHTML('beforeend', counterHtml);
    }
  }

  // Load brief in parallel (kicked off from init's Promise.all)
  await loadBrief(p);
}

function renderStepper(status) {
  const activeIdx = STEPS.findIndex(s => s.key === status);
  document.getElementById('stepper').innerHTML = STEPS.map((s, i) => {
    const done   = i < activeIdx;
    const active = i === activeIdx;
    return `
    <div class="stepper-step ${done ? 'done' : ''} ${active ? 'active' : ''}">
      <div class="stepper-dot">${done ? '✓' : i + 1}</div>
      <div class="stepper-label">${typeof s.label === 'function' ? s.label() : s.label}</div>
    </div>`;
  }).join('');
}

async function loadBrief(project) {
  const { data: brief } = await db.from('briefs').select('*').eq('project_id', projectId).single();
  const container = document.getElementById('brief-container');
  if (!container) return;

  if (!brief) {
    const hasBriefStatus = ['brief-envoye','en-cours','revision','concept-livre','termine'].includes(project.status);
    container.innerHTML = hasBriefStatus
      ? renderEmptyState('file-text', t('client.brief.processing'), t('client.brief.processing.hint'))
      : `<div style="text-align:center;padding:20px;">
           ${renderEmptyState('clipboard-list', t('client.brief.notsubmitted'), t('client.brief.notsubmitted.hint'), `<a href="brief.html" class="btn btn-primary">${t('client.brief.fill')}</a>`)}
         </div>`;
    return;
  }

  const content = brief.content || {};
  const revisions = content.revisions || [];
  // Champs du questionnaire initial (exclure revisions et revision_*)
  const originalKeys = Object.keys(content).filter(k => k !== 'revisions' && !k.startsWith('revision_'));

  const fieldLabels = {
    company_name: t('brief.field.company'), activity: t('brief.field.activity'), target: t('brief.field.target'),
    values: t('brief.field.values'), style: t('brief.field.style'), colors: t('brief.field.colors'),
    competitors: t('brief.field.competitors'), notes: t('brief.field.notes')
  };

  const revisionFieldLabels = {
    concept: 'Concept choisi',
    raison: 'Raison du choix',
    evaluations: 'Évaluations',
    couleurs: 'Couleurs',
    typographie: 'Typographie',
    icone: 'Icône / Symbole',
    style: 'Style',
    a_garder: 'Éléments à garder',
    a_retirer: 'Éléments à retirer',
    objectif: 'Objectif de la révision',
    notes: 'Notes supplémentaires'
  };

  let html = '';

  // Révisions en premier (dernière en haut)
  if (revisions.length) {
    revisions.forEach((rev, i) => {
      const revNum = revisions.length - i;
      const revDate = rev.date ? new Date(rev.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
      html += `
        <div style="margin-bottom:28px;padding:20px;background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.2);border-radius:14px;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
            <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#FBBF24,#F59E0B);display:flex;align-items:center;justify-content:center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </div>
            <div>
              <div style="font-size:var(--text-sm);font-weight:700;color:#FBBF24;">Révision ${revNum}</div>
              ${revDate ? `<div style="font-size:var(--text-xs);color:var(--fg-muted);">${revDate}</div>` : ''}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px;">
            ${Object.entries(revisionFieldLabels).map(([key, label]) => {
              const val = rev[key];
              if (!val) return '';
              return `<div>
                <div class="brief-key">${escHtml(label)}</div>
                <div class="brief-val">${escHtml(String(val))}</div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
    });
  }

  // Questionnaire initial en dessous
  if (originalKeys.length) {
    html += `
      <div style="margin-bottom:20px;">
        <div style="font-size:var(--text-xl);font-weight:700;color:var(--fg);">${t('client.brief.title')}</div>
        <div style="font-size:var(--text-xs);color:var(--fg-muted);margin-top:4px;">Questionnaire initial</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;">
        ${originalKeys.filter(k => content[k]).map(k => `
          <div class="brief-block">
            <div class="brief-key">${escHtml(fieldLabels[k] || k.replace(/_/g,' '))}</div>
            <div class="brief-val">${escHtml(String(content[k]))}</div>
          </div>
        `).join('')}
      </div>`;
  }

  if (html) {
    container.innerHTML = html;
  } else {
    container.innerHTML = renderEmptyState('file-text', t('client.brief.empty'), t('client.brief.empty.hint'));
  }
}

// ── Files & Folders (client: read-only folders, upload to current folder) ──
let allFiles = [];
let currentFolder = null;

async function loadFiles() {
  const { data: files } = await db.from('deliverables').select('*')
    .eq('project_id', projectId).order('created_at', { ascending: false });
  allFiles = files || [];
  renderFilesView();
}

function getFolders(visibleFiles) {
  const folders = new Set();
  visibleFiles.forEach(f => { if (f.category) folders.add(f.category); });
  return Array.from(folders).sort();
}

function renderFilesView() {
  const container = document.getElementById('files-container');
  const pathEl = document.getElementById('current-folder-path');
  const breadcrumb = document.getElementById('folder-breadcrumb');

  // Filter out hidden files — client should never see them
  const visibleFiles = allFiles.filter(f => !f.is_hidden);

  if (currentFolder) {
    pathEl.style.display = 'flex';
    breadcrumb.innerHTML = `<span style="color:var(--fg-subtle);">›</span> <span style="font-weight:600;color:var(--fg);">${escHtml(currentFolder)}</span>`;
    const files = visibleFiles.filter(f => f.category === currentFolder && f.file_name !== '.folder');
    if (!files.length) {
      container.innerHTML = renderEmptyState('folder-open', t('files.folder.empty'), t('client.folder.empty.hint'));
    } else {
      container.innerHTML = '<div class="files-grid">' + files.map(f => renderFileCard(f,
        `downloadFile('${f.id}','${escHtml(f.file_path)}','${escHtml(f.file_name)}')`
      )).join('') + '</div>';
    }
  } else {
    pathEl.style.display = 'none';
    const folders = getFolders(visibleFiles);
    const uncategorized = visibleFiles.filter(f => !f.category && f.file_name !== '.folder');
    if (!folders.length && !uncategorized.length) {
      container.innerHTML = renderEmptyState('upload-cloud', t('client.files.empty'), t('client.files.empty.hint'));
    } else {
      let html = '';
      if (folders.length) {
        html += '<div class="files-grid">';
        html += folders.map(folder => {
          const count = visibleFiles.filter(f => f.category === folder && f.file_name !== '.folder').length;
          return `
          <div class="glass-card file-card" style="cursor:pointer;" onclick="openFolder('${escHtml(folder)}')">
            <div class="file-icon" style="background:rgba(232,89,12,0.12);"><i data-lucide="folder" style="width:28px;height:28px;color:var(--purple);"></i></div>
            <div class="file-name">${escHtml(folder)}</div>
            <div class="file-meta">${count} ${count > 1 ? t('files') : t('file')}</div>
          </div>`;
        }).join('');
        html += '</div>';
      }
      if (uncategorized.length) {
        if (folders.length) html += `<div style="margin-top:20px;font-size:var(--text-xs);font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;">${t('files.title')}</div>`;
        html += '<div class="files-grid">' + uncategorized.map(f => renderFileCard(f,
          `downloadFile('${f.id}','${escHtml(f.file_path)}','${escHtml(f.file_name)}')`
        )).join('') + '</div>';
      }
      container.innerHTML = html;
    }
  }
  if (typeof loadFileThumbnails === 'function') loadFileThumbnails();
}

function openFolder(folder) { currentFolder = folder; renderFilesView(); }

async function handleFiles(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;
  const folder = currentFolder || 'source';
  for (const file of files) {
    try {
      const path = `${projectId}/client-${Date.now()}-${sanitizeFileName(file.name)}`;
      await uploadFile('deliverables', path, file);
      await db.from('deliverables').insert({
        project_id: projectId, file_name: file.name, file_path: path,
        file_size: file.size, file_type: file.type,
        category: folder, uploaded_by: currentUser.id
      });
      showToast(`${file.name} ${t('files.uploaded')}`, 'success');
    } catch(e) {
      showToast(`${t('files.upload.error')} ${file.name}`, 'error');
    }
  }
  await loadFiles();
}

async function downloadFile(id, path, name) {
  const url = await getFileUrl('deliverables', path);
  if (!url) { showToast(t('files.download.error'), 'error'); return; }
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
