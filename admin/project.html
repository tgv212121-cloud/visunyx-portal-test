<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projet - Visunyx Studio</title>
  <link rel="icon" href="https://cdn.prod.website-files.com/6877a7a543a6800105f4b19d/6877a8a8bd06034b54695630_webclip.avif">
  <link rel="dns-prefetch" href="https://nokrexfszurxxuspvbjd.supabase.co">
  <link rel="preconnect" href="https://nokrexfszurxxuspvbjd.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style-base.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/lucide@0.309.0/dist/umd/lucide.min.js" defer></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/supabase.js"></script>
  <script src="../shared/components.js"></script>
  <script src="../shared/chat.js"></script>

  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Brief */
    .brief-section { margin-bottom: 28px; }
    .brief-key {
      font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--purple); margin-bottom: 8px;
    }
    .brief-val {
      font-size: var(--text-sm); color: var(--fg); line-height: 1.75;
      background: var(--bg-card); border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm); padding: 14px 16px;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--glass-border); border-radius: var(--radius);
      padding: 40px 24px; text-align: center; cursor: pointer;
      transition: all 0.25s var(--ease); margin-bottom: 20px;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--purple); background: var(--purple-subtle);
    }
    .upload-zone input[type=file] { display: none; }

    /* Activity timeline */
    .timeline { display: flex; flex-direction: column; gap: 0; }
    .timeline-item {
      display: flex; gap: 14px; padding: 16px 0;
      border-bottom: 1px solid rgba(147,50,255,0.07);
      position: relative;
    }
    .timeline-item:last-child { border-bottom: none; }
    .timeline-dot {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--purple-subtle); border: 1px solid rgba(147,50,255,0.25);
      display: flex; align-items: center; justify-content: center;
      color: var(--purple); flex-shrink: 0; margin-top: 2px;
    }
    .timeline-body { flex: 1; }
    .timeline-desc { font-size: var(--text-sm); color: var(--fg); line-height: 1.4; }
    .timeline-desc strong { color: var(--fg); }
    .timeline-time { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 3px; }

    /* Status selector */
    .status-selector {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px;
    }
    .status-btn {
      padding: 7px 14px; border-radius: 100px; font-size: var(--text-xs);
      font-weight: 600; cursor: pointer; border: 1px solid var(--glass-border);
      background: var(--bg-card); color: var(--fg-muted);
      transition: all 0.2s var(--ease);
    }
    .status-btn:hover { border-color: var(--glass-border-h); color: var(--fg); }
    .status-btn.selected { background: var(--purple); color: #fff; border-color: var(--purple); box-shadow: 0 2px 10px rgba(147,50,255,0.35); }

    .meta-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .meta-item { display: flex; flex-direction: column; gap: 4px; }
    .meta-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-subtle); }
    .meta-value { font-size: var(--text-sm); font-weight: 600; color: var(--fg); }

    @media (max-width: 860px) {
      #tab-apercu > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
      #tab-brief  > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 600px) {
      .tabs { flex-wrap: wrap; }
      .status-selector { gap: 4px; }
      .status-btn { padding: 5px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
<div class="vx-bg"><div class="vx-orb vx-orb-1"></div><div class="vx-orb vx-orb-2"></div><div class="vx-orb vx-orb-3"></div></div>
<div class="vx-grid"></div>
<svg class="vx-noise" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg>

<div class="app-layout">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div id="topbar-container"></div>

    <div class="page-content">

      <!-- Page tabs -->
      <div class="tabs" style="margin-bottom:24px;">
        <button class="tab-btn active" onclick="switchTab('apercu')" data-i18n="tab.overview">Aperçu</button>
        <button class="tab-btn" onclick="switchTab('brief')" data-i18n="tab.brief">Brief</button>
        <button class="tab-btn" onclick="switchTab('fichiers')" data-i18n="tab.files">Fichiers</button>
        <button class="tab-btn" onclick="switchTab('messages')" data-i18n="tab.messages">Messages <span id="msg-badge" style="display:none;background:var(--purple);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;margin-left:4px;"></span></button>
        <button class="tab-btn" onclick="switchTab('interne')" data-i18n="tab.internal">Interne <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#FBBF24;margin-left:4px;vertical-align:middle;"></span></button>
        <button class="tab-btn" onclick="switchTab('historique')" data-i18n="tab.activity">Historique</button>
      </div>

      <!-- TAB: Aperçu -->
      <div id="tab-apercu" class="tab-content active">
        <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;">
          <div class="glass-card" style="padding:28px;">
            <div id="project-header">
              <div class="skeleton" style="height:28px;width:60%;margin-bottom:12px;"></div>
              <div class="skeleton" style="height:14px;width:40%;"></div>
            </div>

            <div class="divider" style="margin:20px 0;"></div>

            <div style="margin-bottom:20px;">
              <div class="meta-label" style="margin-bottom:10px;" data-i18n="admin.project.status">Statut du projet</div>
              <div class="status-selector" id="status-selector"></div>
            </div>

            <div class="meta-row" style="gap:24px;margin-top:20px;" id="meta-row">
              <!-- filled by JS -->
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:16px;">
            <!-- Client card -->
            <div class="glass-card" style="padding:20px;" id="client-card">
              <div class="meta-label" style="margin-bottom:12px;" data-i18n="admin.project.client">Client</div>
              <div id="client-info"><div class="skeleton" style="height:14px;width:80%;margin-bottom:6px;"></div><div class="skeleton" style="height:12px;width:60%;"></div></div>
            </div>
            <!-- Designer card -->
            <div class="glass-card" style="padding:20px;" id="designer-card">
              <div class="meta-label" style="margin-bottom:12px;" data-i18n="admin.project.designer">Designer assigné</div>
              <div id="designer-list" style="display:flex;flex-direction:column;gap:8px;">
                <div style="color:var(--fg-subtle);font-size:var(--text-xs);" data-i18n="admin.project.nodesigner">Aucun designer</div>
              </div>
              <div style="margin-top:12px;">
                <select class="vx-select" id="designer-select" style="font-size:var(--text-xs);padding:8px 12px;">
                  <option value="" data-i18n="admin.project.assign">Assigner un designer...</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB: Brief -->
      <div id="tab-brief" class="tab-content">
        <!-- AI Brief (main) -->
        <div class="glass-card" style="padding:28px;margin-bottom:20px;display:none;" id="ai-brief-card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,rgba(147,50,255,0.2),rgba(77,101,255,0.15));border:1px solid rgba(147,50,255,0.3);display:flex;align-items:center;justify-content:center;">
                <i data-lucide="sparkles" style="width:16px;height:16px;color:var(--purple);"></i>
              </div>
              <div>
                <div style="font-size:var(--text-base);font-weight:700;color:var(--fg);" data-i18n="admin.project.aibrief">Brief généré par IA</div>
              </div>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="copyBrief()" id="btn-copy-brief">
              <i data-lucide="copy" style="width:12px;height:12px;"></i> <span data-i18n="admin.project.copy">Copier</span>
            </button>
          </div>
          <div id="ai-brief-content" style="font-size:var(--text-sm);color:var(--fg);line-height:1.85;white-space:pre-wrap;background:rgba(0,0,0,0.2);border:1px solid var(--glass-border);border-radius:12px;padding:24px;max-height:600px;overflow-y:auto;"></div>
        </div>

      </div>

      <!-- TAB: Fichiers -->
      <div id="tab-fichiers" class="tab-content">
        <!-- Upload zone -->
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()"
             ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
          <input type="file" id="file-input" multiple onchange="handleFiles(this.files)">
          <i data-lucide="upload-cloud" style="width:36px;height:36px;color:var(--purple);margin-bottom:12px;"></i>
          <div style="font-size:var(--text-base);font-weight:600;color:var(--fg);margin-bottom:4px;" data-i18n="files.upload">
            Déposer des fichiers ici
          </div>
          <div style="font-size:var(--text-xs);color:var(--fg-muted);" data-i18n="files.upload.hint">
            ou cliquer pour sélectionner · PNG, JPG, SVG, PDF, ZIP, AI, PSD…
          </div>
        </div>

        <!-- Folder actions -->
        <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" onclick="promptNewFolder()">
            <i data-lucide="folder-plus" style="width:14px;height:14px;margin-right:5px;"></i> <span data-i18n="files.newfolder">Nouveau dossier</span>
          </button>
          <div id="current-folder-path" style="font-size:var(--text-xs);color:var(--fg-muted);display:none;align-items:center;gap:6px;">
            <a href="#" onclick="openFolder(null);return false;" style="color:var(--purple);text-decoration:none;font-weight:600;" data-i18n="files.allfiles">Tous les fichiers</a>
            <span id="folder-breadcrumb"></span>
          </div>
        </div>

        <div id="files-container">
          <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>
      </div>

      <!-- TAB: Messages -->
      <div id="tab-messages" class="tab-content">
        <div class="glass-card" style="overflow:hidden;">
          <div class="chat-wrap">
            <div class="chat-messages" id="chat-messages">
              <div style="text-align:center;padding:40px 20px;color:var(--fg-subtle);font-size:var(--text-sm);" data-i18n="loading">Chargement des messages…</div>
            </div>
            <div class="chat-pending-attachment" id="msg-input-pending">
              <i data-lucide="paperclip" style="width:12px;height:12px;color:var(--purple);flex-shrink:0;"></i>
              <span id="msg-input-pending-name" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
              <button class="remove-attach" onclick="removePendingAttachment('msg-input')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
            <div class="chat-input-bar">
              <button class="btn-attach" onclick="document.getElementById('msg-attach-file').click()">
                <i data-lucide="paperclip" style="width:16px;height:16px;"></i>
              </button>
              <input type="file" id="msg-attach-file" style="display:none;" onchange="setPendingAttachment('msg-input', this.files)">
              <textarea id="msg-input" data-i18n="chat.placeholder" placeholder="Écrire un message au client…" rows="1"></textarea>
              <button class="btn btn-primary btn-icon" onclick="window._clientChat.sendMessage()" title="Envoyer" data-i18n-title="btn.send">
                <i data-lucide="send" style="width:16px;height:16px;"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB: Interne (admin + designers) -->
      <div id="tab-interne" class="tab-content">
        <div style="padding:10px 14px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);border-radius:10px;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span style="font-size:var(--text-xs);color:#FBBF24;font-weight:600;" data-i18n="chat.internal.label">Espace interne - visible uniquement par l'equipe (admin + designers)</span>
        </div>
        <div class="glass-card" style="overflow:hidden;">
          <div class="chat-wrap">
            <div class="chat-messages" id="int-messages">
              <div style="text-align:center;padding:40px 20px;color:var(--fg-subtle);font-size:var(--text-sm);" data-i18n="loading">Chargement...</div>
            </div>
            <div class="chat-input-bar">
              <textarea id="int-input" data-i18n="chat.placeholder.internal" placeholder="Message interne (equipe uniquement)..." rows="1"></textarea>
              <button class="btn btn-icon" onclick="window._internalChat.sendMessage()" title="Envoyer" data-i18n-title="btn.send" style="background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.3);color:#FBBF24;">
                <i data-lucide="send" style="width:16px;height:16px;"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB: Historique -->
      <div id="tab-historique" class="tab-content">
        <div class="glass-card" style="padding:24px;">
          <div class="timeline" id="activity-timeline">
            <div class="timeline-item">
              <div class="skeleton" style="width:32px;height:32px;border-radius:50%;flex-shrink:0;"></div>
              <div style="flex:1;"><div class="skeleton" style="height:13px;width:70%;margin-bottom:6px;"></div><div class="skeleton" style="height:10px;width:40%;"></div></div>
            </div>
            <div class="timeline-item">
              <div class="skeleton" style="width:32px;height:32px;border-radius:50%;flex-shrink:0;"></div>
              <div style="flex:1;"><div class="skeleton" style="height:13px;width:60%;margin-bottom:6px;"></div><div class="skeleton" style="height:10px;width:35%;"></div></div>
            </div>
            <div class="timeline-item">
              <div class="skeleton" style="width:32px;height:32px;border-radius:50%;flex-shrink:0;"></div>
              <div style="flex:1;"><div class="skeleton" style="height:13px;width:75%;margin-bottom:6px;"></div><div class="skeleton" style="height:10px;width:45%;"></div></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script>
let projectId   = null;
let projectData = null;
let currentUser = null;
let allFiles    = [];
let catFilter   = '';

const STATUSES = ['nouveau','brief-envoye','en-cours','revision','concept-livre','termine'];

async function init() {
  const auth = await requireAuth(['developer', 'admin']);
  if (!auth) return;
  currentUser = auth.user;

  projectId = getParam('id');
  if (!projectId) { window.location.href = 'index.html'; return; }

  document.getElementById('sidebar-container').innerHTML = renderSidebar('projects');
  document.getElementById('topbar-container').innerHTML  = renderTopbar(
    t('admin.project.page'), '',
    `<a href="index.html" class="btn btn-ghost btn-sm">
       <i data-lucide="arrow-left" style="width:13px;height:13px;"></i> <span data-i18n="btn.back">Retour</span>
     </a>`
  );
  await setupSidebarUser();
  refreshIcons();

  await Promise.all([loadProject(), loadFiles(), loadHistory(), loadDesignerAssignment()]);
  initSpotlight();
  initMagnetic('[data-magnetic]');
  translatePage();

  // Auto-switch to tab if URL has hash
  if (window.location.hash === '#messages') switchTab('messages');
  if (window.location.hash === '#interne') switchTab('interne');

  // Client ↔ Admin chat
  const userName = auth.profile.full_name || auth.user.email;
  window._clientChat = new ChatChannel({
    projectId,
    currentUserId: currentUser.id,
    currentUserName: userName,
    currentUserRole: 'admin',
    isInternal: false,
    messagesContainer: document.getElementById('chat-messages'),
    inputElement: document.getElementById('msg-input'),
    attachInputId: 'msg-input',
    badgeElement: document.getElementById('msg-badge'),
    pollIntervalMs: 0,
    onActivity: () => API.logActivity({ project_id: projectId, client_id: projectData?.client_id, user_id: currentUser.id, action: 'message_sent', details: {} })
  });

  // Internal chat (admin + designer)
  window._internalChat = new ChatChannel({
    projectId,
    currentUserId: currentUser.id,
    currentUserName: userName,
    currentUserRole: 'admin',
    isInternal: true,
    messagesContainer: document.getElementById('int-messages'),
    inputElement: document.getElementById('int-input'),
    pollIntervalMs: 0
  });

  await Promise.all([window._clientChat.loadMessages(), window._internalChat.loadMessages()]);
}

// ── Tabs ──────────────────────────────────────────────────────
const tabButtons = [];
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`tab-${name}`)?.classList.add('active');
  document.querySelectorAll('.tabs .tab-btn').forEach(btn => {
    if (btn.getAttribute('onclick')?.includes(`'${name}'`)) btn.classList.add('active');
  });
  if (name === 'messages' && window._clientChat) window._clientChat.markRead();
}

// ── Project ───────────────────────────────────────────────────
async function loadProject() {
  try {
    projectData = await API.getProject(projectId);
    renderProjectHeader();
    renderClientInfo();
    await loadBrief();
    refreshIcons();
  } catch(e) {
    showToast(t('admin.project.load.error'), 'error');
  }
}

function renderProjectHeader() {
  const p = projectData;
  document.title = `${p.title} - Visunyx Studio`;
  document.getElementById('project-header').innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <div>
        <div style="font-size:var(--text-2xl);font-weight:800;color:var(--fg);margin-bottom:6px;">${escHtml(p.title)}</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${renderStatusBadge(p.status)}
          ${renderPriorityBadge(p.priority)}
          <span style="font-size:var(--text-xs);color:var(--fg-subtle);">${escHtml(p.project_type || '')}</span>
        </div>
      </div>
    </div>`;

  // Status selector
  document.getElementById('status-selector').innerHTML = STATUSES.map(s => `
    <button class="status-btn ${p.status === s ? 'selected' : ''}"
            onclick="changeStatus('${s}')">${tStatus(s)}</button>
  `).join('');

  // Meta row
  document.getElementById('meta-row').innerHTML = `
    <div class="meta-item">
      <span class="meta-label">${t('project.order')}</span>
      <span class="meta-value">${formatDate(p.order_date)}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">${t('project.deadline')}</span>
      <span class="meta-value" style="${p.due_date && new Date(p.due_date) < new Date() && p.status !== 'termine' ? 'color:#F87171;' : ''}">${formatDate(p.due_date)}</span>
    </div>
    ${p.delivered_at ? `<div class="meta-item"><span class="meta-label">${t('admin.project.delivered')}</span><span class="meta-value" style="color:#34D399;">${formatDate(p.delivered_at)}</span></div>` : ''}
  `;

  refreshIcons();
}

function renderClientInfo() {
  const c = projectData.clients;
  document.getElementById('client-info').innerHTML = c ? `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <div class="avatar" style="width:36px;height:36px;font-size:13px;border-radius:10px;">${initials(c.company_name)}</div>
      <div>
        <div style="font-weight:700;font-size:var(--text-sm);color:var(--fg);">${escHtml(c.company_name)}</div>
        <div style="font-size:var(--text-xs);color:var(--fg-muted);">${escHtml(c.contact_name || '')}</div>
      </div>
    </div>
    ${c.contact_email ? `<div style="font-size:var(--text-xs);color:var(--fg-muted);margin-bottom:4px;"><a href="mailto:${escHtml(c.contact_email)}" style="color:var(--purple);">${escHtml(c.contact_email)}</a></div>` : ''}
    ${c.phone ? `<div style="font-size:var(--text-xs);color:var(--fg-muted);">${escHtml(c.phone)}</div>` : ''}
    <a href="./client.html?id=${projectData.client_id}" class="btn btn-ghost btn-sm" style="margin-top:12px;width:100%;">
      <i data-lucide="external-link" style="width:12px;height:12px;"></i> ${t('project.viewclient')}
    </a>` : '<span style="color:var(--fg-subtle);">-</span>';
  refreshIcons();
}

async function changeStatus(newStatus) {
  const old = projectData.status;
  if (old === newStatus) return;
  try {
    const extra = newStatus === 'concept-livre' ? { delivered_at: new Date().toISOString() } : {};
    await API.updateProject(projectId, { status: newStatus, ...extra });
    await API.logActivity({
      project_id: projectId, client_id: projectData.client_id, user_id: currentUser.id,
      action: 'status_changed', details: { from: old, to: newStatus }
    });
    projectData.status = newStatus;
    renderProjectHeader();
    showToast(`${t('admin.project.status.changed')} ${tStatus(newStatus)}`, 'success');
    // Notify client by email
    fetch('/api/notify-status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-secret': API_SECRET },
      body: JSON.stringify({ project_id: projectId, new_status: newStatus })
    }).catch(() => {});
    refreshIcons();
  } catch(e) {
    showToast(t('admin.project.status.error'), 'error');
  }
}

// ── Brief ─────────────────────────────────────────────────────
let _aiBriefText = '';

async function loadBrief() {
  const brief = await API.getBrief(projectId);

  if (!brief) {
    return;
  }

  // Show AI brief if it contains the structured format (has "---" separator = FR + EN)
  const summary = brief.summary || '';
  const isAiBrief = summary.includes('---') || summary.length > 500;

  if (isAiBrief && summary) {
    _aiBriefText = summary;
    document.getElementById('ai-brief-card').style.display = '';
    document.getElementById('ai-brief-content').textContent = summary;
    // Don't put AI brief in the notes textarea
    document.getElementById('brief-summary').value = '';
  } else {
    document.getElementById('brief-summary').value = summary;
  }
}

function copyBrief() {
  navigator.clipboard.writeText(_aiBriefText).then(() => {
    const btn = document.getElementById('btn-copy-brief');
    btn.innerHTML = '<i data-lucide="check" style="width:12px;height:12px;"></i> ' + t('admin.project.copied');
    refreshIcons();
    setTimeout(() => {
      btn.innerHTML = '<i data-lucide="copy" style="width:12px;height:12px;"></i> ' + t('admin.project.copy');
      refreshIcons();
    }, 2000);
  });
}

async function saveBriefSummary() {
  const summary = document.getElementById('brief-summary').value.trim();
  try {
    await API.saveBrief(projectId, { summary });
    await API.logActivity({
      project_id: projectId, client_id: projectData.client_id, user_id: currentUser.id,
      action: 'brief_updated', details: {}
    });
    showToast(t('admin.project.brief.saved'), 'success');
  } catch(e) {
    showToast(t('admin.project.brief.save.error'), 'error');
  }
}

// ── Files & Folders ──────────────────────────────────────────
let currentFolder = null; // null = root view (show folders), string = inside a folder

async function loadFiles() {
  try {
    allFiles = await API.getDeliverables(projectId);
    renderFilesView();
    refreshIcons();
  } catch(e) { console.error(e); }
}

function getFolders() {
  const folders = new Set();
  allFiles.forEach(f => { if (f.category) folders.add(f.category); });
  return Array.from(folders).sort();
}

function renderFilesView() {
  const container = document.getElementById('files-container');
  const pathEl = document.getElementById('current-folder-path');
  const breadcrumb = document.getElementById('folder-breadcrumb');

  if (currentFolder) {
    // Inside a folder — show files in this folder
    pathEl.style.display = 'flex';
    breadcrumb.innerHTML = `<span style="color:var(--fg-subtle);">›</span> <span style="font-weight:600;color:var(--fg);">${escHtml(currentFolder)}</span>`;
    const files = allFiles.filter(f => f.category === currentFolder && f.file_name !== '.folder');
    if (!files.length) {
      container.innerHTML = renderEmptyState('folder-open', t('files.folder.empty'), t('files.folder.hint'));
    } else {
      container.innerHTML = '<div class="files-grid">' + files.map(f => wrapFileCard(f, renderFileCard(
        f,
        `downloadFile('${f.id}','${escHtml(f.file_path)}','${escHtml(f.file_name)}')`,
        `deleteFile('${f.id}','${escHtml(f.file_path)}','${escHtml(f.file_name)}')`,
        `renameFile('${f.id}','${escHtml(f.file_name)}')`
      ))).join('') + '</div>';
    }
  } else {
    // Root view — show folders + uncategorized files
    pathEl.style.display = 'none';
    const folders = getFolders();
    const uncategorized = allFiles.filter(f => !f.category && f.file_name !== '.folder');

    if (!folders.length && !uncategorized.length) {
      container.innerHTML = renderEmptyState('upload-cloud', t('files.empty'), t('files.empty.hint'));
    } else {
      let html = '';
      // Folders
      if (folders.length) {
        html += '<div class="files-grid">';
        html += folders.map(folder => {
          const count = allFiles.filter(f => f.category === folder && f.file_name !== '.folder').length;
          const folderFiles = allFiles.filter(f => f.category === folder);
          const folderHidden = folderFiles.some(f => f.file_name === '.folder' && f.is_hidden);
          const folderPlaceholder = folderFiles.find(f => f.file_name === '.folder');
          return `
          <div class="glass-card file-card" style="cursor:pointer;position:relative;${folderHidden ? 'opacity:0.4;' : ''}" onclick="openFolder('${escHtml(folder)}')">
            <div class="file-icon" style="background:rgba(147,50,255,0.12);"><i data-lucide="folder" style="width:28px;height:28px;color:var(--purple);"></i></div>
            <div class="file-name">${escHtml(folder)}</div>
            <div class="file-meta">${count} ${t('files.title').toLowerCase()}</div>
            <div style="position:absolute;top:8px;right:8px;display:flex;gap:4px;">
              ${folderPlaceholder ? `<button class="btn btn-ghost btn-sm btn-icon" onclick="event.stopPropagation();toggleFileVisibility('${folderPlaceholder.id}',${!!folderHidden})" title="${folderHidden ? 'Afficher' : 'Masquer'}" style="width:24px;height:24px;padding:0;">
                <i data-lucide="${folderHidden ? 'eye-off' : 'eye'}" style="width:11px;height:11px;"></i>
              </button>` : ''}
              <button class="btn btn-ghost btn-sm btn-icon" onclick="event.stopPropagation();renameFolder('${escHtml(folder)}')" title="${t('btn.edit')}" style="width:24px;height:24px;padding:0;">
                <i data-lucide="pencil" style="width:11px;height:11px;"></i>
              </button>
              <button class="btn btn-danger btn-sm btn-icon" onclick="event.stopPropagation();deleteFolder('${escHtml(folder)}')" title="${t('btn.delete')}" style="width:24px;height:24px;padding:0;">
                <i data-lucide="trash-2" style="width:11px;height:11px;"></i>
              </button>
            </div>
          </div>`;
        }).join('');
        html += '</div>';
      }
      // Uncategorized files
      if (uncategorized.length) {
        if (folders.length) html += `<div style="margin-top:20px;font-size:var(--text-xs);font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;">${t('files.nofiles')}</div>`;
        html += '<div class="files-grid">' + uncategorized.map(f => wrapFileCard(f, renderFileCard(
          f,
          `downloadFile('${f.id}','${escHtml(f.file_path)}','${escHtml(f.file_name)}')`,
          `deleteFile('${f.id}','${escHtml(f.file_path)}','${escHtml(f.file_name)}')`
        ))).join('') + '</div>';
      }
      container.innerHTML = html;
    }
  }
  refreshIcons();
  if (typeof loadFileThumbnails === 'function') loadFileThumbnails();
}

function openFolder(folder) {
  currentFolder = folder;
  renderFilesView();
}

async function promptNewFolder() {
  const name = await promptInput(t('files.newfolder.title'), t('files.newfolder.placeholder'), '', 'folder-plus', t('files.newfolder.create'));
  if (!name) return;
  if (getFolders().includes(name)) { showToast(t('files.folder.exists'), 'error'); return; }
  try {
    // Create a placeholder entry so the folder persists even when empty
    await API.createDeliverable({
      project_id: projectId, file_name: '.folder', file_path: '',
      file_size: 0, file_type: 'folder', category: name, uploaded_by: currentUser.id
    });
    await loadFiles();
    showToast(t('files.folder.created'), 'success');
  } catch(e) { showToast(t('admin.project.load.error'), 'error'); }
}

async function renameFolder(oldName) {
  const newName = await promptInput(t('files.rename.title'), t('files.rename.placeholder'), oldName, 'pencil', t('files.rename.confirm'));
  if (!newName || newName === oldName) return;
  if (getFolders().includes(newName)) { showToast(t('files.folder.exists'), 'error'); return; }
  try {
    const filesInFolder = allFiles.filter(f => f.category === oldName);
    for (const f of filesInFolder) {
      await db.from('deliverables').update({ category: newName }).eq('id', f.id);
    }
    if (currentFolder === oldName) currentFolder = newName;
    await loadFiles();
    showToast(t('files.folder.renamed'), 'success');
  } catch(e) { showToast(t('admin.project.load.error'), 'error'); }
}

async function renameFile(fileId, oldName) {
  const newName = await promptInput(t('files.rename.file'), t('files.rename.placeholder'), oldName, 'file-edit', t('files.rename.confirm'));
  if (!newName || newName === oldName) return;
  try {
    await db.from('deliverables').update({ file_name: newName }).eq('id', fileId);
    await loadFiles();
    showToast(t('files.folder.renamed'), 'success');
  } catch(e) { showToast(t('admin.project.load.error'), 'error'); }
}

function deleteFolder(folderName) {
  const filesInFolder = allFiles.filter(f => f.category === folderName);
  const msg = filesInFolder.length
    ? `"${folderName}" ${t('admin.project.folder.delete.msg.full').replace('{count}', filesInFolder.length)}`
    : `"${folderName}" ${t('admin.project.folder.delete.msg.empty')}`;

  confirmAction(t('files.folder.delete.title'), msg, async () => {
    try {
      for (const f of filesInFolder) {
        await API.deleteDeliverable(f.id, f.file_path);
      }
      if (currentFolder === folderName) currentFolder = null;
      allFiles = allFiles.filter(f => f.category !== folderName);
      renderFilesView();
      showToast(t('files.folder.deleted'), 'success');
    } catch(e) {
      showToast(t('admin.project.load.error'), 'error');
    }
  });
}

function handleDragOver(e) { e.preventDefault(); document.getElementById('upload-zone').classList.add('drag-over'); }
function handleDragLeave()  { document.getElementById('upload-zone').classList.remove('drag-over'); }
function handleDrop(e)      { e.preventDefault(); handleDragLeave(); handleFiles(e.dataTransfer.files); }

async function handleFiles(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;
  const folder = currentFolder || null;
  for (const file of files) {
    try {
      const path = `${projectId}/${Date.now()}-${sanitizeFileName(file.name)}`;
      await uploadFile('deliverables', path, file);
      await API.createDeliverable({
        project_id:  projectId,
        file_name:   file.name,
        file_path:   path,
        file_size:   file.size,
        file_type:   file.type,
        category:    folder,
        uploaded_by: currentUser.id
      });
      await API.logActivity({
        project_id: projectId, client_id: projectData?.client_id, user_id: currentUser.id,
        action: 'file_uploaded', details: { file_name: file.name, folder: folder }
      });
      showToast(`${file.name} ${t('files.uploaded')}`, 'success');
    } catch(e) {
      showToast(`${t('files.upload.error')} ${file.name}`, 'error');
    }
  }
  await loadFiles();
}

async function downloadFile(id, path, name) {
  const url = await getFileUrl('deliverables', path);
  if (!url) { showToast(t('files.download.error'), 'error'); return; }
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
}

function deleteFile(id, path, name) {
  confirmAction(t('files.delete.title'), `"${name || ''}" ${t('files.delete.msg')}`, async () => {
    try {
      await API.deleteDeliverable(id, path);
      showToast(t('files.deleted'), 'success');
      await loadFiles();
    } catch(e) {
      showToast(t('admin.project.load.error'), 'error');
    }
  });
}

// ── File visibility toggle ───────────────────────────────────
function wrapFileCard(file, cardHtml) {
  const hidden = !!file.is_hidden;
  return `<div style="position:relative;${hidden ? 'opacity:0.4;' : ''}">
    ${cardHtml}
    <button class="btn btn-ghost btn-sm btn-icon" onclick="event.stopPropagation();toggleFileVisibility('${file.id}',${hidden})" title="${hidden ? 'Afficher' : 'Masquer'}" style="position:absolute;top:8px;right:8px;width:24px;height:24px;padding:0;z-index:2;">
      <i data-lucide="${hidden ? 'eye-off' : 'eye'}" style="width:11px;height:11px;"></i>
    </button>
  </div>`;
}

async function toggleFileVisibility(id, isHidden) {
  await db.from('deliverables').update({ is_hidden: !isHidden }).eq('id', id);
  const file = allFiles.find(f => f.id === id);
  if (file) file.is_hidden = !isHidden;
  renderFilesView();
}

// ── Messages (handled by ChatChannel from shared/chat.js) ────

// ── History ───────────────────────────────────────────────────
async function loadHistory() {
  const logs = await API.getActivity({ project_id: projectId });
  const timeline = document.getElementById('activity-timeline');
  if (!logs.length) {
    timeline.innerHTML = renderEmptyState('clock', t('admin.project.history.empty'), t('admin.project.history.empty.hint'));
    refreshIcons();
    return;
  }
  timeline.innerHTML = logs.map(log => `
    <div class="timeline-item">
      <div class="timeline-dot">
        <i data-lucide="${activityIcon(log.action)}" style="width:14px;height:14px;"></i>
      </div>
      <div class="timeline-body">
        <div class="timeline-desc">${activityLabel(log)}</div>
        <div class="timeline-time">${formatDateTime(log.created_at)} · ${escHtml(log.profiles?.full_name || t('activity.system'))}</div>
      </div>
    </div>
  `).join('');
  refreshIcons();
}

// ── Designer Assignment ───────────────────────────────────────
async function loadDesignerAssignment() {
  try {
    const [assigned, allDesigners] = await Promise.all([
      API.getProjectDesigners(projectId),
      API.getDesigners()
    ]);
    renderAssignedDesigners(assigned || []);
    renderDesignerSelect(allDesigners || [], assigned || []);
  } catch(e) { console.error(e); }
}

function renderAssignedDesigners(assigned) {
  const container = document.getElementById('designer-list');
  if (!assigned.length) {
    container.innerHTML = `<div style="color:var(--fg-subtle);font-size:var(--text-xs);">${t('admin.project.nodesigner')}</div>`;
    return;
  }
  container.innerHTML = assigned.map(a => {
    const d = a.designers;
    return `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-sm);">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="avatar" style="width:24px;height:24px;font-size:9px;border-radius:6px;">${initials(d.full_name)}</div>
        <div>
          <div style="font-size:var(--text-xs);font-weight:600;color:var(--fg);">${escHtml(d.full_name)}</div>
          <div style="font-size:10px;color:var(--fg-subtle);">${escHtml(d.specialty || '')}</div>
        </div>
      </div>
      <button class="btn btn-danger btn-sm btn-icon" onclick="unassignDesigner('${d.id}')" title="${t('btn.delete')}" style="padding:4px;">
        <i data-lucide="x" style="width:11px;height:11px;"></i>
      </button>
    </div>`;
  }).join('');
  refreshIcons();
}

function renderDesignerSelect(all, assigned) {
  const assignedIds = assigned.map(a => a.designers?.id);
  const available = all.filter(d => d.is_active && !assignedIds.includes(d.id));
  const sel = document.getElementById('designer-select');
  sel.innerHTML = `<option value="">${t('admin.project.assign')}</option>` +
    available.map(d => `<option value="${d.id}">${escHtml(d.full_name)} - ${escHtml(d.specialty || '')}</option>`).join('');
  sel.onchange = async function() {
    if (!this.value) return;
    try {
      const designerId = this.value;
      await API.assignDesigner(projectId, designerId);
      await API.logActivity({
        project_id: projectId, client_id: projectData?.client_id, user_id: currentUser.id,
        action: 'project_updated', details: { action: 'designer_assigned' }
      });
      // Notifier le designer par email
      fetch(rootPath() + 'api/notify-designer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-secret': API_SECRET },
        body: JSON.stringify({ project_id: projectId, designer_id: designerId })
      }).catch(() => {});
      showToast(t('admin.project.designer.assigned'), 'success');
      await loadDesignerAssignment();
    } catch(e) { showToast(t('admin.project.designer.assign.error'), 'error'); }
  };
}

function unassignDesigner(designerId) {
  confirmAction(t('admin.project.unassign.title'), t('admin.project.unassign.msg'), async () => {
    try {
      await API.removeDesignerFromProject(projectId, designerId);
      await API.logActivity({
        project_id: projectId, client_id: projectData?.client_id, user_id: currentUser.id,
        action: 'project_updated', details: { action: 'designer_removed' }
      });
      showToast(t('admin.project.designer.removed'), 'success');
      await loadDesignerAssignment();
    } catch(e) { showToast(t('admin.project.designer.remove.error'), 'error'); }
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
