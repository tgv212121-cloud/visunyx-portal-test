<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable - Visunyx Studio</title>
  <link rel="icon" href="https://cdn.prod.website-files.com/6877a7a543a6800105f4b19d/6877a8a8bd06034b54695630_webclip.avif">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0e10;color:#e8e8e8;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
    .wrap{text-align:center;padding:40px 20px;max-width:440px}
    .code{font-size:clamp(100px,20vw,180px);font-weight:800;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,0.12);line-height:0.9;letter-spacing:-0.04em}
    .title{font-size:clamp(16px,3vw,20px);font-weight:600;margin:20px 0 8px;letter-spacing:-0.02em}
    .sub{font-size:14px;color:#737373;line-height:1.6;margin-bottom:28px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;background:#E8590C;color:#fff;font-family:inherit;font-size:13px;font-weight:600;border:none;border-radius:3px;cursor:pointer;text-decoration:none;transition:background 0.12s cubic-bezier(0.16,1,0.3,1)}
    .btn:hover{background:#F97316}
  </style>
  <script src="./shared/i18n.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="title" data-i18n="error.404">Page introuvable</div>
    <p class="sub" data-i18n="error.404.hint">La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <a href="/login.html" class="btn" data-i18n="error.404.back">Retour à l'accueil</a>
  </div>
  <script>document.addEventListener('DOMContentLoaded', () => { if (typeof translatePage === 'function') translatePage(); });</script>
</body>
</html>
